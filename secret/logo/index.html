<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile picture options</title>
<style>body{margin:0;background:#f3f2ef;font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1d2226}main{max-width:1100px;margin:30px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.opt{background:#fff;border:1px solid #e0dfdc;border-radius:12px;padding:16px;text-align:center}
.opt img{width:100%;border-radius:10px;border:1px solid #eee}.small{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px}.small img{border-radius:8px;border:1px solid #ddd}
h1{font-size:22px}b{font-size:20px}</style></head><body><main>
<h1>Logo: purple arrow on navy (current pick)</h1>
<div class="grid"><div class="opt"><b>Profile picture</b><img src="navy-800.png?v=3"><div class="small"><img src="navy-800.png?v=3" width="72"><img src="navy-800.png?v=3" width="40"></div></div>
<div class="opt"><b>Website header version</b><img src="navy-lockup.png?v=3" style="border:0;margin-top:40px"></div></div>
<h1 style="margin-top:40px">Earlier options</h1>

<div class="grid">
<div class="opt"><b>A</b> · like the original (white lines)<img src="variant-A.png"><div class="small"><img src="variant-A.png" width="72"><img src="variant-A.png" width="40"></div></div>
<div class="opt"><b>B</b> · solid flat paper plane<img src="variant-B.png"><div class="small"><img src="variant-B.png" width="72"><img src="variant-B.png" width="40"></div></div>
<div class="opt"><b>C</b> · bold navigation arrow<img src="variant-C.png"><div class="small"><img src="variant-C.png" width="72"><img src="variant-C.png" width="40"></div></div>
<div class="opt"><b>D</b> · minimal arrow, gold dot<img src="variant-D.png"><div class="small"><img src="variant-D.png" width="72"><img src="variant-D.png" width="40"></div></div>
</div></main></body></html>
